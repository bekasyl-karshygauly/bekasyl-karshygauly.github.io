<style>
:root{
  --page:#F4F7FB; --paper:#FFFFFF; --side:#F2F6FD;
  --ink:#0F1B2D; --text-2:#475569; --text-3:#6B7A90;
  --blue:#1F5EDB; --blue-deep:#1648B0; --blue-soft:#E9F0FD; --blue-line:rgba(31,94,219,.24);
  --line:#E6ECF4; --line-2:#D8E1EE;
  --side-w:320px;
  --ease:cubic-bezier(.22,.61,.36,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
a{color:inherit;text-decoration:none}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* toolbar */
.toolbar{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.toolbar-in{max-width:1140px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:12px}
.mark{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2);letter-spacing:.01em}
.mark b{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:12px;letter-spacing:.04em}
.spacer{flex:1}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--text-3);font:600 11.5px/1 Inter,system-ui,sans-serif;letter-spacing:.08em;padding:8px 10px;border-radius:7px;cursor:pointer;transition:color .2s,background .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue)}
.tbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 13px/1 Inter,system-ui,sans-serif;padding:10px 14px;border-radius:10px;cursor:pointer;transition:border-color .2s,background .2s,color .2s}
.tbtn:hover{border-color:var(--blue-line);color:var(--blue)}
.tbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.tbtn.primary:hover{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}
@media screen and (max-width:640px){.mark span{display:none}.tbtn .lbl{display:none}.tbtn{padding:10px 11px}.toolbar-in{padding:10px 16px}}

/* sheet */
.sheet{max-width:1140px;margin:32px auto 56px;display:grid;grid-template-columns:var(--side-w) 1fr;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(15,27,45,.04),0 12px 40px rgba(15,27,45,.06);transition:opacity .22s var(--ease)}
.sheet.swap{opacity:0}
@media screen and (max-width:1188px){.sheet{margin:24px 24px 48px}}
aside{background:var(--side);padding:36px 30px 40px}
main{padding:52px 56px 56px;min-width:0}

/* sidebar */
.photo{border-radius:14px;overflow:hidden;aspect-ratio:4/5;background:#fff;margin-bottom:32px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.sblock + .sblock{margin-top:30px}
.slabel{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);margin:0 0 14px}
.contacts{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.contacts li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center}
.contacts .ic{width:30px;height:30px;border-radius:8px;background:var(--paper);display:grid;place-items:center;color:var(--blue)}
.contacts .ic svg{width:14px;height:14px}
.contacts small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);line-height:1.3}
.contacts .v{font-size:13.5px;color:var(--ink);overflow-wrap:anywhere;line-height:1.35;transition:color .2s}
.contacts a.v:hover{color:var(--blue)}
.sgroup + .sgroup{margin-top:14px}
.sgroup h4{margin:0 0 8px;font-size:12px;font-weight:500;color:var(--text-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;line-height:1;padding:7px 9px;border-radius:7px;background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.langs{display:grid;gap:14px}
.lang-row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.lang-row span{color:var(--text-3);font-size:12.5px;text-align:right}
.meter{height:3px;background:var(--line-2);border-radius:3px;margin-top:7px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:3px}
.extra{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.extra li{font-size:13px;color:var(--text-2);padding-left:14px;position:relative;line-height:1.5}
.extra li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--blue)}

/* main */
.hello{padding-bottom:30px;border-bottom:1px solid var(--line);margin-bottom:34px}
.hello .m-photo{display:none;width:112px;height:140px;object-fit:cover;border-radius:12px;background:#fff}
h1{font-size:clamp(34px,4.6vw,48px);line-height:1.05;letter-spacing:-.035em;font-weight:700;margin:0;color:var(--ink)}
.role{margin:12px 0 0;color:var(--blue);font-size:15.5px;font-weight:500;letter-spacing:.005em}
.meta-line{margin:14px 0 0;display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--text-3);font-size:13px}
.meta-line span{display:inline-flex;align-items:center;gap:7px}
.meta-line a:hover{color:var(--blue)}
.meta-line svg{width:14px;height:14px;color:var(--blue)}
.section + .section{margin-top:38px}
.mlabel{font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);margin:0 0 18px}
.summary{margin:0;color:var(--text-2);font-size:15.5px;line-height:1.72;max-width:760px}
.items{display:grid;gap:26px}
.item{display:grid;grid-template-columns:120px 1fr;gap:6px 24px;break-inside:avoid}
.period{font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums;padding-top:3px}
.item h3{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.org{margin:3px 0 0;font-size:13.5px;color:var(--blue)}
.bul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.bul li{position:relative;padding-left:16px;color:var(--text-2);font-size:14px;line-height:1.6}
.bul li::before{content:"";position:absolute;left:0;top:.68em;width:5px;height:5px;border-radius:50%;background:var(--blue-line)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:11.5px;color:var(--blue);background:var(--blue-soft);border-radius:6px;padding:5px 8px;line-height:1}
.ilink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--blue);font-weight:500;transition:color .2s}
.ilink:hover{color:var(--blue-deep)}
.ilink svg{width:13px;height:13px;transition:transform .25s var(--ease)}
.ilink:hover svg{transform:translate(2px,-2px)}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.card{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:18px 18px 16px;break-inside:avoid;display:flex;flex-direction:column;transition:border-color .25s,box-shadow .25s,transform .25s var(--ease),opacity .7s var(--ease)}
.card:hover{border-color:var(--blue-line);box-shadow:0 8px 24px rgba(31,94,219,.08)}
.card h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.card .meta{font-size:12px;color:var(--blue);margin-top:5px}
.card p{margin:9px 0 0;font-size:13.5px;color:var(--text-2);line-height:1.6}
.card .ilink{align-self:flex-start;margin-top:auto;padding-top:10px}
.certs{list-style:none;margin:0;padding:0}
.certs li{display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line);break-inside:avoid}
.certs li:first-child{padding-top:0}
.certs li:last-child{border-bottom:0}
.certs .ic{width:28px;height:28px;border-radius:7px;background:var(--blue-soft);display:grid;place-items:center;color:var(--blue)}
.certs .ic svg{width:14px;height:14px}
.certs b{font-weight:600;font-size:14.5px;display:block;line-height:1.4}
.certs span{color:var(--text-3);font-size:13px}
.certs time{color:var(--text-3);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.certs li.has-img{grid-template-columns:28px 1fr auto 112px}
.cview{display:flex;width:max-content;align-items:center;gap:5px;margin-top:6px;padding:0;border:0;background:none;font:500 12.5px/1.4 Inter,system-ui,sans-serif;color:var(--blue);cursor:pointer}
.cview svg{width:12px;height:12px;transition:transform .25s var(--ease)}
.cview:hover svg{transform:translate(2px,-2px)}
.cthumb{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:zoom-in;width:112px;aspect-ratio:1.42;transition:border-color .2s,box-shadow .25s}
.cthumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.cthumb:hover{border-color:var(--blue-line);box-shadow:0 6px 18px rgba(31,94,219,.12)}
.cthumb:hover img{transform:scale(1.06)}
.cthumb:focus-visible,.cview:focus-visible,.vclose:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* certificate viewer */
#viewer{border:0;padding:0;border-radius:14px;background:var(--paper);max-width:min(1100px,94vw);width:auto;max-height:92vh;overflow:hidden;box-shadow:0 30px 80px rgba(15,27,45,.35);color:var(--ink)}
#viewer[open]{display:flex;flex-direction:column;animation:vIn .28s var(--ease)}
#viewer::backdrop{background:rgba(15,27,45,.55);backdrop-filter:blur(3px);animation:bIn .28s ease}
#viewer.closing{animation:vOut .18s ease forwards}
#viewer.closing::backdrop{animation:bOut .18s ease forwards}
.vhead{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line)}
.vhead b{font-size:14.5px;font-weight:600}
.vhead span{font-size:12.5px;color:var(--text-3);flex:1}
.vclose{margin-left:auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.vclose:hover{border-color:var(--blue-line);color:var(--blue)}
#viewer-img{display:block;max-width:100%;max-height:calc(92vh - 60px);object-fit:contain;background:#F4F7FB;margin:0 auto}
@keyframes vIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes vOut{to{opacity:0;transform:translateY(6px) scale(.99)}}
@keyframes bIn{from{opacity:0}to{opacity:1}}
@keyframes bOut{to{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #viewer[open]{animation:bIn .25s ease}
  #viewer.closing{animation:bOut .18s ease forwards}
  .cthumb img,.cview svg{transition:none}
  .cthumb:hover img{transform:none}
}
@media screen and (max-width:640px){
  .certs li.has-img{grid-template-columns:28px 1fr}
  .certs li.has-img .cthumb{grid-column:2;width:150px;margin-top:4px}
}
.foot{margin-top:42px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--text-3);font-size:12px}
.foot a:hover{color:var(--blue)}

/* featured projects */
.feat{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column;transition:border-color .25s,box-shadow .3s,opacity .7s var(--ease),transform .7s var(--ease)}
.fcard:hover{border-color:var(--blue-line);box-shadow:0 12px 32px rgba(31,94,219,.10)}
.shot{display:block;background:#EEF2F8;border-bottom:1px solid var(--line);overflow:hidden}
.shot .bar{display:flex;align-items:center;gap:5px;height:26px;padding:0 11px;background:#F6F8FB;border-bottom:1px solid var(--line)}
.shot .bar i{width:7px;height:7px;border-radius:50%;background:#D3DCE8}
.shot .bar span{margin-left:8px;font-size:10.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot .frame{overflow:hidden}
.shot img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:top;transition:transform .7s var(--ease)}
.fcard:hover .shot img{transform:scale(1.035)}
.fbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:9px;flex:1}
.ftop{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.fcard h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.015em}
.status{font-size:11.5px;color:var(--text-3);display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:#22A06B;box-shadow:0 0 0 3px rgba(34,160,107,.14)}
.fbody p{margin:0;font-size:13.5px;color:var(--text-2);line-height:1.6}
.fbody .tags{margin-top:0}
.factions{display:flex;gap:18px;margin-top:auto;padding-top:4px}
.factions .ilink{margin-top:0}
.fnote{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3)}
.fnote svg{width:13px;height:13px}
.fcard.wide{grid-column:1/-1;display:grid;grid-template-columns:1.15fr 1fr}
.fcard.wide .shot{border-bottom:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
.fcard.wide .frame{flex:1;background:#14161b}
.fcard.wide .shot img{height:100%}
.fcard.wide .fbody{padding:20px 22px 22px}
@media screen and (max-width:1000px){.fcard.wide{grid-template-columns:1fr}.fcard.wide .shot{border-right:0;border-bottom:1px solid var(--line)}.fcard.wide .shot img{height:auto}}
@media screen{.card.is-featured{display:none}}
@media (prefers-reduced-motion:reduce){.fcard:hover .shot img{transform:none}.shot img{transition:none}}

/* fade animations: elements with .fx fade up when they enter the screen */
.fx{opacity:0;transform:translateY(10px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0ms)}
.fx.in{opacity:1;transform:none}
.meter i{transform-origin:left;transform:scaleX(0);transition:transform 1s var(--ease) .25s}
.fx.in .meter i{transform:scaleX(1)}
/* Reduced motion: keep the gentle opacity fade, drop all movement */
@media (prefers-reduced-motion:reduce){
  .fx{transform:none;transition:opacity .6s ease;transition-delay:var(--d,0ms)}
  .meter i{transform:none;transition:none}
  .card,.ilink svg{transition:none}
  .ilink:hover svg{transform:none}
}

/* responsive */
@media screen and (max-width:1000px){
  .grid2{grid-template-columns:1fr 1fr}
  main{padding:44px 40px 48px}
}
@media screen and (max-width:820px){
  .sheet{grid-template-columns:1fr;border-radius:16px}
  main{order:-1}
  aside{display:grid;grid-template-columns:1fr 1fr;gap:30px 32px;padding:32px 40px 36px}
  aside .photo{display:none}
  aside .sblock + .sblock{margin-top:0}
  .hello{display:grid;grid-template-columns:112px 1fr;gap:0 22px;align-items:center}
  .hello .m-photo{display:block;grid-row:span 3}
}
@media screen and (max-width:640px){
  .feat{grid-template-columns:1fr}
  .sheet{margin:0;border-radius:0;border-left:0;border-right:0;box-shadow:none}
  aside{display:block;padding:28px 16px 32px}
  aside .sblock + .sblock{margin-top:26px}
  .hello{grid-template-columns:1fr}
  .hello .m-photo{width:96px;height:120px;margin-bottom:18px;grid-row:auto}
  main{padding:30px 16px 36px}
  .item{grid-template-columns:1fr;gap:4px}
  .period{padding-top:0}
  .grid2{grid-template-columns:1fr}
  .certs li{grid-template-columns:28px 1fr}
  .certs time{grid-column:2;padding-top:0}
}

/* print / PDF: A4, same colors and structure */
@page{size:A4;margin:0}
@media print{
  :root{--side-w:64mm}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:transparent!important}
  html{background:linear-gradient(to right,var(--side) 0,var(--side) 64mm,#fff 64mm)!important}
  body{font-size:9.2pt;line-height:1.5;width:210mm}
  .toolbar{display:none}
  .fx{opacity:1!important;transform:none!important;transition:none!important}
  .meter i{transform:none!important;transition:none!important}
  .slabel,.mlabel,.sgroup h4{break-after:avoid;page-break-after:avoid}
  .sblock,.langs,.extra,.item,.card,.certs li{break-inside:avoid;page-break-inside:avoid}
  .sheet{margin:0;max-width:none;width:210mm;border:0;border-radius:0;box-shadow:none;background:transparent;grid-template-columns:64mm 1fr;opacity:1!important}
  aside{background:transparent;padding:13mm 7mm 12mm 9mm;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  main{padding:13mm 11mm 12mm 9mm;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .photo{margin-bottom:7mm;border-radius:3mm}
  .sblock + .sblock{margin-top:6.5mm}
  .slabel,.mlabel{font-size:7.2pt;margin-bottom:3.2mm}
  .contacts{gap:2.6mm}.contacts .v{font-size:8.4pt}.contacts small{font-size:6.6pt}
  .contacts li{grid-template-columns:7mm 1fr;gap:2.4mm}.contacts .ic{width:7mm;height:7mm;border-radius:2mm}
  .chip{font-size:7.6pt;padding:1.4mm 1.8mm;border-radius:1.6mm}
  .sgroup h4{font-size:7.8pt;margin-bottom:1.6mm}.sgroup + .sgroup{margin-top:3mm}
  .lang-row{font-size:8.4pt}.lang-row span{font-size:7.8pt}.langs{gap:3mm}
  .extra li{font-size:8.2pt}
  .hello{padding-bottom:6mm;margin-bottom:7mm}
  h1{font-size:25pt}
  .role{font-size:10pt;margin-top:2.4mm}
  .meta-line{font-size:8.2pt;margin-top:2.6mm}
  .summary{font-size:9.2pt;line-height:1.6}
  .section + .section{margin-top:7mm}
  .items{gap:4.6mm}
  .item{grid-template-columns:24mm 1fr;gap:1mm 5mm}
  .period{font-size:7.8pt}
  .item h3{font-size:10pt}.org{font-size:8.4pt}
  .bul{margin-top:1.8mm;gap:1mm}.bul li{font-size:8.6pt;line-height:1.5;padding-left:3.6mm}
  .tags{margin-top:2.2mm}.tag{font-size:7.2pt;padding:1.1mm 1.6mm}
  .ilink{font-size:8.2pt;margin-top:1.8mm}
  .grid2{grid-template-columns:1fr 1fr 1fr;gap:3mm}
  .card{padding:3.4mm;border-radius:2.4mm;box-shadow:none}
  .card h3{font-size:9.2pt}.card .meta{font-size:7.6pt}.card p{font-size:8.2pt;line-height:1.5}
  .certs li{padding:2.6mm 0;gap:3mm;grid-template-columns:6.5mm 1fr auto}
  .certs li:first-child{padding-top:0}
  .certs .ic{width:6.5mm;height:6.5mm}
  .certs b{font-size:9pt}.certs span{font-size:8pt}.certs time{font-size:7.8pt}
  .foot{display:none}
  .feat-section{display:none}
  .cthumb,.cview,#viewer{display:none!important}
  .certs li.has-img{grid-template-columns:6.5mm 1fr auto}
}
</style>
</head>
<body>

<div class="toolbar" role="toolbar">
  <div class="toolbar-in">
    <div class="mark"><b>BQ</b><span id="t-resume">Түйіндеме</span></div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="kk" aria-pressed="true">ҚАЗ</button>
      <button type="button" data-lang="ru" aria-pressed="false">РУС</button>
      <button type="button" data-lang="en" aria-pressed="false">ENG</button>
    </div>
    <button class="tbtn" type="button" id="btn-print" title="Print"><svg class="i" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 18H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7z"/></svg><span class="lbl" id="t-print">Басып шығару</span></button>
    <a class="tbtn primary" id="btn-pdf" href="resume-kk.pdf" download><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="lbl" id="t-download">PDF жүктеу</span></a>
  </div>
</div>

<div class="sheet" id="resume"></div>

<dialog id="viewer" aria-labelledby="viewer-title">
  <div class="vhead"><b id="viewer-title"></b><span id="viewer-note"></span><button type="button" class="vclose" id="viewer-close" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <img id="viewer-img" alt="">
</dialog>

<noscript><p style="max-width:640px;margin:40px auto;color:#B4BDCC;padding:0 16px">This resume needs JavaScript. A PDF version is available: <a href="resume-en.pdf" style="color:#D4AF65">resume-en.pdf</a></p></noscript>

<script src="content.js"></script>
<script>
(function(){
  const R = window.RESUME, S = R.shared;
  const LANGS = ["kk","ru","en"];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const icon = {
    phone:'<svg class="i" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
    email:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    city:'<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    telegram:'<svg class="i" viewBox="0 0 24 24"><path d="M21.5 4.5 2.8 11.7c-.8.3-.8 1.4 0 1.7l4.7 1.6 1.8 5.6c.2.7 1.1.9 1.6.4l2.7-2.5 4.8 3.5c.6.4 1.4.1 1.6-.6L22.9 5.8c.2-.9-.6-1.6-1.4-1.3zM9.5 15.3l9-8.1"/></svg>',
    github:'<svg class="i" viewBox="0 0 24 24"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>',
    globe:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
    arrow:'<svg class="i" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg>',
    award:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 22l5-3 5 3-1.5-8"/></svg>',
    lock:'<svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
  };

  // Fade-in: blocks fade up as they enter the screen; ones already visible on load fade in one after another.
  let io = null;
  function setupFade(animate){
    const els = document.querySelectorAll("#resume .photo, #resume .sblock, #resume .hello, #resume .mlabel, #resume .summary, #resume .item, #resume .card, #resume .fcard, #resume .certs li");
    if (io) io.disconnect();
    if (!animate || !("IntersectionObserver" in window)) {
      els.forEach(el => el.classList.add("fx", "in")); return;
    }
    let shown = 0;
    io = new IntersectionObserver(entries => {
      entries.filter(e => e.isIntersecting).forEach(e => {
        const el = e.target;
        const sib = el.parentElement ? [...el.parentElement.children].indexOf(el) : 0;
        const delay = Math.min(shown < 12 ? shown * 70 : (el.matches(".card, .certs li, .item") ? sib * 90 : 0), 700);
        el.style.setProperty("--d", delay + "ms");
        el.classList.add("in");
        shown++;
        io.unobserve(el);
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
    els.forEach(el => { el.classList.add("fx"); io.observe(el); });
    setTimeout(() => { shown = 99; }, 1200);
    // Safety net: if the observer never fires (hidden tab, odd embed), show everything.
    setTimeout(() => {
      if (!document.querySelector("#resume .fx.in")) document.querySelectorAll("#resume .fx").forEach(el => el.classList.add("in"));
    }, 1600);
  }

  function render(lang, animate = true){
    const d = R[lang], u = d.ui;
    const contact = (key, label, value, href) => `<li><span class="ic">${icon[key]}</span><div><small>${esc(label)}</small>${href ? `<a class="v" href="${esc(href)}"${href.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}>${esc(value)}</a>` : `<span class="v">${esc(value)}</span>`}</div></li>`;
    const aside = `
      <aside>
        <div class="photo"><img src="${esc(S.photo)}" width="640" height="800" alt="${esc(d.name)}"></div>
        <div class="sblock contact-block">
          <p class="slabel">${esc(u.contacts)}</p>
          <ul class="contacts">
            ${contact("phone", u.phone, S.phone.value, S.phone.href)}
            ${contact("email", u.email, S.email.value, S.email.href)}
            ${contact("city", u.city, d.city)}
            ${contact("telegram", u.telegram, S.telegram.value, S.telegram.href)}
            ${contact("github", u.github, S.github.value, S.github.href)}
          </ul>
        </div>
        <div class="sblock">
          <p class="slabel">${esc(u.skills)}</p>
          ${d.skills.map(g => `<div class="sgroup"><h4>${esc(g.group)}</h4><div class="chips">${g.items.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div></div>`).join("")}
        </div>
        <div class="sblock">
          <p class="slabel">${esc(u.languages)}</p>
          <div class="langs">${d.languages.map(l => `<div><div class="lang-row"><b style="font-weight:500">${esc(l.name)}</b><span>${esc(l.level)}</span></div><div class="meter"><i style="width:${Number(l.value)||0}%"></i></div></div>`).join("")}</div>
        </div>
        <div class="sblock">
          <p class="slabel">${esc(u.extra)}</p>
          <ul class="extra">${d.extra.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        </div>
      </aside>`;

    const link = l => l ? `<a class="ilink" href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)}${icon.arrow}</a>` : "";
    const exp = d.experience.map(e => `
      <article class="item">
        <div class="period">${esc(e.period)}</div>
        <div>
          <h3>${esc(e.role)}</h3>
          <p class="org">${esc(e.org)}</p>
          <ul class="bul">${e.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>
          ${e.tags && e.tags.length ? `<div class="tags">${e.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
          ${link(e.link)}
        </div>
      </article>`).join("");
    const edu = d.education.map(e => `
      <article class="item">
        <div class="period">${esc(e.period)}</div>
        <div>
          <h3>${esc(e.org)}</h3>
          <p class="org">${esc(e.degree)}</p>
          <ul class="bul">${e.details.map(b => `<li>${esc(b)}</li>`).join("")}</ul>
        </div>
      </article>`).join("");
    const host = url => { try { return new URL(url).host + new URL(url).pathname.replace(/\/$/, ""); } catch(e) { return url; } };
    const feat = (S.featured || []).map(f => {
      const shotInner = `
          <div class="bar"><i></i><i></i><i></i><span>${esc(f.bar || host(f.live))}</span></div>
          <div class="frame"><img src="${esc(f.image)}" width="1200" height="750" loading="lazy" alt="${esc(f.title)}"></div>`;
      const shot = f.live
        ? `<a class="shot" href="${esc(f.live)}" target="_blank" rel="noopener" aria-label="${esc(f.title)}: ${esc(u.live)}">${shotInner}</a>`
        : `<div class="shot">${shotInner}</div>`;
      const actions = [
        f.live ? `<a class="ilink" href="${esc(f.live)}" target="_blank" rel="noopener">${esc(u.live)}${icon.arrow}</a>` : "",
        f.repo ? `<a class="ilink" href="${esc(f.repo)}" target="_blank" rel="noopener">${esc(u.code)}${icon.arrow}</a>` : "",
        f.note ? `<span class="fnote">${icon.lock}${esc(f.note[lang])}</span>` : ""
      ].join("");
      return `
      <article class="fcard${f.wide ? " wide" : ""}">
        ${shot}
        <div class="fbody">
          <div class="ftop"><h3>${esc(f.title)}</h3><span class="status">${esc(f.status[lang])}</span></div>
          <p>${esc(f.desc[lang])}</p>
          <div class="tags">${f.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
          <div class="factions">${actions}</div>
        </div>
      </article>`;
    }).join("");
    const proj = d.projects.map(p => `
      <div class="card${p.featured ? " is-featured" : ""}"><h3>${esc(p.title)}</h3><div class="meta">${esc(p.meta)}</div><p>${esc(p.text)}</p>${link(p.link)}</div>`).join("");
    const certs = d.certificates.map(c => {
      const open = c.image ? `data-img="${esc(c.image)}" data-title="${esc(c.title)}" data-note="${esc(c.note || "")}"` : "";
      return `
      <li class="${c.image ? "has-img" : ""}">
        <span class="ic">${icon.award}</span>
        <div><b>${esc(c.title)}</b><span>${esc(c.issuer)}</span>${c.image ? `<button type="button" class="cview" ${open}>${esc(u.view)}${icon.arrow}</button>` : ""}</div>
        <time>${esc(c.date)}</time>
        ${c.image ? `<button type="button" class="cthumb" ${open} aria-label="${esc(u.view)}: ${esc(c.title)}"><img src="${esc(c.thumb || c.image)}" width="360" height="254" loading="lazy" alt=""></button>` : ""}
      </li>`;
    }).join("");

    const main = `
      <main>
        <header class="hello">
          <img class="m-photo" src="${esc(S.photo)}" width="112" height="140" alt="">
          <h1>${esc(d.name)}</h1>
          <p class="role">${esc(d.title)}</p>
          <p class="meta-line">
            <span>${icon.city}${esc(d.city)}</span>
            <span>${icon.globe}<a href="${esc(S.site.href)}">${esc(S.site.value)}</a></span>
          </p>
        </header>
        <section class="section"><h2 class="mlabel">${esc(u.profile)}</h2><p class="summary">${esc(d.summary)}</p></section>
        ${feat ? `<section class="section feat-section"><h2 class="mlabel">${esc(u.featured)}</h2><div class="feat">${feat}</div></section>` : ""}
        <section class="section"><h2 class="mlabel">${esc(u.experience)}</h2><div class="items">${exp}</div></section>
        <section class="section"><h2 class="mlabel">${esc(u.education)}</h2><div class="items">${edu}</div></section>
        <section class="section"><h2 class="mlabel">${esc(u.projects)}</h2><div class="grid2">${proj}</div></section>
        <section class="section"><h2 class="mlabel">${esc(u.certificates)}</h2><ul class="certs">${certs}</ul></section>
        <div class="foot"><span>© 2026 ${esc(d.name)}</span><a href="${esc(S.github.href)}" target="_blank" rel="noopener">${esc(S.github.value)}</a></div>
      </main>`;

    document.getElementById("resume").innerHTML = aside + main;
    setupFade(animate);
    document.documentElement.lang = d.meta.lang;
    document.title = d.meta.title;
    document.getElementById("t-resume").textContent = u.resume;
    document.getElementById("t-print").textContent = u.print;
    document.getElementById("t-download").textContent = u.download;
    const pdf = document.getElementById("btn-pdf");
    pdf.href = S.pdf[lang]; pdf.setAttribute("download", S.pdfName[lang]);
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  }

  let lang = "kk";
  try {
    const q = new URLSearchParams(location.search).get("lang");
    const s = localStorage.getItem("cv-lang");
    if (LANGS.includes(q)) lang = q; else if (LANGS.includes(s)) lang = s;
  } catch(e){}
  render(lang);

  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem("cv-lang", lang); } catch(e){}
    const sheet = document.getElementById("resume");
    // Cross-fade: fade the sheet out, swap the text, fade it back in.
    sheet.classList.add("swap");
    setTimeout(() => { render(lang, false); requestAnimationFrame(() => sheet.classList.remove("swap")); }, 220);
  }));
  document.getElementById("btn-print").addEventListener("click", () => window.print());

  // Certificate viewer: click a thumbnail or "view original" to see the scan.
  const viewer = document.getElementById("viewer");
  const vimg = document.getElementById("viewer-img");
  document.getElementById("resume").addEventListener("click", ev => {
    const b = ev.target.closest("[data-img]");
    if (!b) return;
    vimg.src = b.dataset.img; vimg.alt = b.dataset.title;
    document.getElementById("viewer-title").textContent = b.dataset.title;
    document.getElementById("viewer-note").textContent = b.dataset.note || "";
    document.getElementById("viewer-close").setAttribute("aria-label", R[lang].ui.close);
    if (viewer.showModal) viewer.showModal(); else window.open(b.dataset.img, "_blank");
  });
  const closeViewer = () => {
    viewer.classList.add("closing");
    setTimeout(() => { viewer.classList.remove("closing"); viewer.close(); }, 180);
  };
  document.getElementById("viewer-close").addEventListener("click", closeViewer);
  viewer.addEventListener("click", ev => { if (ev.target === viewer) closeViewer(); });
  viewer.addEventListener("cancel", ev => { ev.preventDefault(); closeViewer(); });
  // If the prebuilt PDF is missing (e.g. opened as a local file after edits), fall back to the print dialog.
  document.getElementById("btn-pdf").addEventListener("click", ev => {
    if (location.protocol === "file:") { ev.preventDefault(); window.print(); }
  });
})();
</script>
</body>
</html>
